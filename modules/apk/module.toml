[module]
id="apk"
name="apk"
description="Android APK security analysis"
version=1

[dependencies]
required=[
  "file",
  "binutils",
  "jdk21",
  "jadx",
  "apktool",
  "android-build-tools",
  "androguard",
  "semgrep",
  "frida-tools",
  "ghidra"
]
optional=[
  "android-emulator"
]

[platforms]
supported=["ubuntu-24.04","ubuntu-26.04","debian-12","debian-13","kali-rolling","parrot-7"]
