[engagement]
name="APK review"
authorized=false

[orchestration]
# Maximum number of delegated agent tasks that may run concurrently.
max_parallel_agents=2
research_max_questions=3
research_max_sources_per_question=5
research_max_report_words=900

[secrets]
store_plaintext=false
analyze_encodings=true
analyze_hashes=true
max_decode_depth=2
ai_plausibility_triage=true
ai_triage_batch_size=20
ai_representative_locations=3

[apk]
# Supports a normal APK or XAPK container.
path="input/app.apk"

[dynamic]
# Dynamic analysis is toolkit-contained and uses only the managed Android
# Emulator. No external Android device is required or assumed.
enabled=false
# auto: choose the best locally possible emulator mode; none: disable runtime.
backend="auto"
# 0 chooses the app target SDK when possible. Explicit values may be used for
# reproducible compatibility testing.
api_level=36
# auto prefers rootable AOSP/default images and falls back to google_apis when
# necessary. Play Store images are intentionally not selected automatically.
image_tag="auto"
# When KVM is unavailable (for example LXC without /dev/kvm, a VM without nested
# virtualization, or ARM target code on an x86_64 host), permit -accel off.
# This can be dramatically slower but keeps a toolkit-only fallback available.
allow_software_emulation=true
headless=true
wipe_data_on_start=true
# Default false so permission prompts and denial behavior remain observable.
grant_runtime_permissions=false
# AOSP/default emulator images normally permit adb root; capability is verified
# after boot and recorded rather than assumed.
request_root=true
allow_frida=false
# Active validation means emulator-local interaction such as invoking exported
# components/deep links. It never authorizes crafted backend/API attacks.
allow_active_validation=false
memory_mb=4096
cores=4
boot_timeout_seconds=600
observation_seconds=15
emulator_port=5554
