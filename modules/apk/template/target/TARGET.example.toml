[engagement]
name="APK review"
authorized=false

[orchestration]
max_parallel_agents=2
research_max_questions=3
research_max_sources_per_question=5
research_max_report_words=900

[secrets]
store_plaintext=false
analyze_encodings=true
analyze_hashes=true
max_decode_depth=2
ai_plausibility_triage=true
ai_triage_batch_size=20
ai_representative_locations=3

[apk]
# Supports a normal APK or XAPK container.
path="input/app.apk"

[dynamic]
# Dynamic analysis is toolkit-contained and uses only the managed Android
# Emulator. No external Android device is required or assumed.
enabled=false
backend="auto"                 # auto | none
# 0 chooses the app target SDK when possible. The runtime may intentionally use
# Android 11/API 30 for the documented x86_64 multi-ABI compatibility fallback.
api_level=36
# auto prefers rootable AOSP/default images and falls back to google_apis.
# Play Store images are not selected by this toolkit flow.
image_tag="auto"               # auto | default | google_apis
# Same-architecture x86_64 emulation can run without KVM via -accel off when
# explicitly allowed. This is much slower but useful when LXC/VM lacks KVM.
allow_software_emulation=true
# Android 11 x86_64 system images support ARMv7/ARM64 binaries. For an app that
# has native code but no x86_64 library, allow the toolkit to select API 30 when
# minSdk <= 30. If false, such a package is reported incompatible on x86_64.
allow_android11_multiabi_fallback=true
headless=true
wipe_data_on_start=true
# Keep false so normal permission prompts/denials remain observable.
grant_runtime_permissions=false
# Root is requested and then verified; it is never assumed from image naming.
request_root=true
allow_frida=false
# Emulator-local component/deep-link/UI validation only. This does not authorize
# crafted/replayed/mutated backend/provider API requests.
allow_active_validation=false
memory_mb=4096
cores=4
boot_timeout_seconds=600
observation_seconds=15
emulator_port=5554
