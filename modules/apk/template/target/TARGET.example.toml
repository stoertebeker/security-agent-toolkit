[engagement]
name="APK review"
authorized=false

[orchestration]
# Maximum number of delegated agent tasks that may run concurrently.
# This is enforced by the agent prompts; OpenCode currently has no native
# max-concurrency scheduler setting. Recommended range: 1-8.
max_parallel_agents=2
# Bounded public-research defaults. Increase only for deliberately deeper runs.
research_max_questions=3
research_max_sources_per_question=5
research_max_report_words=900

[secrets]
# Keep false for ordinary projects. In a protected workspace, true stores exact
# matched/decoded values under reports/sensitive/ with restrictive permissions.
store_plaintext=false
# Try percent/hex/base64/base64url decoding locally. No web requests are used.
analyze_encodings=true
# Guess structured hash/KDF formats and cautious candidates for bare digests.
# The toolkit never cracks hashes automatically.
analyze_hashes=true
# Maximum recursive local decode layers. Recommended range: 0-3.
max_decode_depth=2

[apk]
path="input/app.apk"

[dynamic]
enabled=false
adb_serial=""
allow_frida=false
