[engagement]
name="Firmware review"
authorized=false

[orchestration]
# Maximum delegated agent tasks executing concurrently. Agent-enforced because
# OpenCode currently has no native global concurrency cap.
max_parallel_agents=2
# Public research remains bounded. One exact-product/version advisory scout is
# allowed early as a hypothesis-seeding exception; all other research is last-mile.
advisory_scout=true
research_max_questions=5
research_max_sources_per_question=5
research_max_report_words=900

[firmware]
# Preserve the vendor filename when practical; it is useful identity evidence.
path="input/firmware.bin"
# Recursive unblob extraction controls. Extraction stays project-local.
extract_processes=4
extract_depth=10
extract_timeout_seconds=3600
max_rootfs_candidates=20

[identity]
# Optional evidence overrides for unusual/proprietary images. Leave blank during
# normal hands-off runs; deterministic identity extraction should populate these
# facts from filename, image strings and the extracted rootfs when possible.
source_filename=""
vendor=""
product=""
hardware_revision=""
region=""
firmware_version=""
build=""
release=""

[analysis]
# Ceilings for expensive focused reviews; these are not target counts.
max_binary_deep_reviews=8
max_service_deep_reviews=8
max_update_deep_reviews=4
# Number of top deterministic web-surface leads that must receive an explicit
# investigate/deprioritize disposition before deep-review selection.
max_web_hypotheses=6
# Maximum focused Ghidra slice iterations for one security hypothesis.
max_ghidra_slices_per_hypothesis=3
# Cross-library work shares the same hypothesis budget. These additional
# ceilings stop one difficult binary or assessment consuming unbounded slices.
max_ghidra_slices_per_binary=6
max_ghidra_slices_per_assessment=12

[secrets]
# Exact credential material is retained only under reports/sensitive/ when true.
store_plaintext=false
# AI triage receives semantic groups, never the raw candidate array.
ai_plausibility_triage=true
ai_triage_batch_size=20
ai_representative_locations=3
