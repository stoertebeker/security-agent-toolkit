[module]
id="firmware"
name="firmware"
description="Deterministic static firmware security analysis with focused reverse engineering"
version=1

[dependencies]
required=[
  "file",
  "binutils",
  "ripgrep",
  "yara",
  "firmware-extractors",
  "unblob",
  "binwalk",
  "semgrep",
  "ghidra"
]
optional=[]

[platforms]
supported=["ubuntu-24.04","ubuntu-26.04","debian-12","debian-13","kali-rolling","parrot-7"]
