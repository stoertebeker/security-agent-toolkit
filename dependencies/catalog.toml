[dependencies.ca-certificates]
kind = "apt"
check = "test -r /etc/ssl/certs/ca-certificates.crt"
packages = ["ca-certificates"]

[dependencies.curl]
kind = "apt"
check = "command -v curl"
packages = ["curl"]

[dependencies.python3]
kind = "apt"
check = "command -v python3"
packages = ["python3"]

[dependencies.unzip]
kind = "apt"
check = "command -v unzip"
packages = ["unzip"]

[dependencies.file]
kind = "apt"
check = "command -v file"
packages = ["file"]

[dependencies.binutils]
kind = "apt"
check = "command -v objdump && command -v readelf && command -v nm"
packages = ["binutils"]

[dependencies.ripgrep]
kind = "apt"
check = "command -v rg"
packages = ["ripgrep"]

[dependencies.yara]
kind = "apt"
check = "command -v yara"
packages = ["yara"]

[dependencies.firmware-extractors]
kind = "apt"
# This is an APT bundle, not a promise that every unblob format helper exists.
# A successful apt transaction installs the broad distro-native extractor set;
# the dependency check verifies the common filesystem extractor only. Exact
# format capability is recorded by `unblob --show-external-dependencies` during
# firmware preparation, where missing helpers become coverage limitations rather
# than blocking unrelated firmware formats.
check = "command -v unsquashfs"
packages = [
  "squashfs-tools",
  "p7zip-full",
  "zstd",
  "lz4",
  "lzop",
  "lziprecover",
  "mtd-utils",
  "device-tree-compiler",
  "e2fsprogs",
  "cpio",
  "xz-utils",
  "android-sdk-libsparse-utils",
  "unar",
  "erofs-utils",
  "partclone"
]

[dependencies.android-build-tools]
kind = "apt"
check = "command -v adb && command -v aapt2 && command -v apksigner"
packages = ["adb", "aapt", "apksigner"]

[dependencies.android-emulator]
kind = "handler"
handler = "install_android_emulator"
check = "test -x \"$SAT_HOME/bin/emulator\" && test -x \"$SAT_HOME/bin/sdkmanager\" && test -x \"$SAT_HOME/bin/avdmanager\" && test -x \"$SAT_HOME/bin/adb\""

[dependencies.tcpdump]
kind = "apt"
check = "command -v tcpdump"
packages = ["tcpdump"]

[dependencies.nmap]
kind = "apt"
check = "command -v nmap"
packages = ["nmap"]

[dependencies.opencode]
kind = "handler"
handler = "install_opencode"
check = "command -v opencode"

[dependencies.uv]
kind = "handler"
handler = "install_uv"
check = "test -x \"$SAT_HOME/bin/uv\""

[dependencies.jdk21]
kind = "handler"
handler = "install_jdk21"
check = "java -version 2>&1 | head -n1 | grep -q '\"21'"

[dependencies.ghidra]
kind = "handler"
handler = "install_ghidra"
check = "command -v analyzeHeadless"

[dependencies.jadx]
kind = "handler"
handler = "install_jadx"
check = "command -v jadx"

[dependencies.apktool]
kind = "handler"
handler = "install_apktool"
check = "command -v apktool"

[dependencies.rust]
kind = "handler"
handler = "install_rust"
check = "command -v cargo && command -v rustc"

[dependencies.binwalk]
kind = "handler"
handler = "install_binwalk"
check = "command -v binwalk"

[dependencies.unblob]
kind = "handler"
handler = "install_unblob"
# Require the toolkit wrapper, not merely uv's direct symlink, because the
# wrapper exposes unblob's dependency-provided console scripts and sbin tools.
check = "test -x \"$SAT_HOME/bin/unblob\" && test ! -L \"$SAT_HOME/bin/unblob\" && grep -q 'python-tools/unblob/bin' \"$SAT_HOME/bin/unblob\""
package = "unblob==26.6.4"
executable = "unblob"

[dependencies.semgrep]
kind = "handler"
handler = "install_python_tool"
check = "command -v semgrep"
package = "semgrep"
executable = "semgrep"

[dependencies.androguard]
kind = "handler"
handler = "install_python_tool"
check = "command -v androguard"
package = "androguard"
executable = "androguard"

[dependencies.frida-tools]
kind = "handler"
handler = "install_python_tool"
check = "command -v frida && command -v frida-ps"
package = "frida-tools"
executable = "frida"
